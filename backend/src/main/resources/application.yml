spring:
  application:
    name: adotei-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/adotei}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://example-issuer.invalid}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://example-issuer.invalid/.well-known/jwks.json}

server:
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger

app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      auth-subject: ${BOOTSTRAP_ADMIN_AUTH_SUBJECT:admin@petmatch.com}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrador Principal}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@petmatch.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4000,http://127.0.0.1:4000}
    cookie:
      secure: ${APP_SECURITY_COOKIE_SECURE:true}
      same-site: ${APP_SECURITY_COOKIE_SAME_SITE:None}
  aws:
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${S3_BUCKET:adotei-assets}
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      presign-expiration-minutes: ${S3_PRESIGN_EXPIRATION_MINUTES:15}
